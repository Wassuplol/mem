name: mem

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mem
      POSTGRES_PASSWORD: mem
      POSTGRES_DB: mem
    ports:
      - "127.0.0.1:5432:5432"
    # postgres:18 images use versioned subdirs; mount the parent dir (docker-library/postgres#1259)
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem -d mem"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Music — Lavalink audio node (YouTube via youtube-source plugin).
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./infra/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./infra/lavalink/plugins:/opt/Lavalink/plugins
    ports:
      - "127.0.0.1:2333:2333"

  # Bot + dashboard containers join this file in a later P1 step (Dockerfiles pending).
  # For now: `pnpm infra:up` starts the databases, `pnpm dev:bot` runs the bot locally.

volumes:
  pgdata:
  redisdata:
